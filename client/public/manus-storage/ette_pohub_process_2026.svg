<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1420" cy="120" r="340" fill="#2563eb" opacity="0.10"/>
  <circle cx="140" cy="920" r="300" fill="#14b8a6" opacity="0.08"/>

  <text x="60" y="176" font-size="25" letter-spacing="6" fill="#5eead4" font-weight="600">ETTE PO HUB · KITCHEN PURCHASING</text>
  <text x="60" y="240" font-size="56" font-weight="700" fill="#f4f7fb">Eleven steps. Zero informal orders.</text>
  <text x="60" y="288" font-size="26" fill="#9fb3c8">The purchase-order cycle — designed as a process, then built as software.</text>

  <!-- Row 1 -->
  <g>
    <rect x="60" y="330" width="352" height="104" rx="18" fill="#bcd7f5"/>
    <text x="88" y="376" font-size="30" font-weight="700" fill="#12263a">1</text>
    <text x="128" y="378" font-size="25" font-weight="600" fill="#12263a">Identify the need</text>
    <rect x="436" y="330" width="352" height="104" rx="18" fill="#bfe8dd"/>
    <text x="464" y="376" font-size="30" font-weight="700" fill="#12263a">2</text>
    <text x="504" y="378" font-size="25" font-weight="600" fill="#12263a">Routine or emergency?</text>
    <rect x="812" y="330" width="352" height="104" rx="18" fill="#cdeac0"/>
    <text x="840" y="376" font-size="30" font-weight="700" fill="#12263a">3</text>
    <text x="880" y="378" font-size="25" font-weight="600" fill="#12263a">Purchase request</text>
    <rect x="1188" y="330" width="352" height="104" rx="18" fill="#eef3b8"/>
    <text x="1216" y="376" font-size="30" font-weight="700" fill="#12263a">4</text>
    <text x="1256" y="378" font-size="25" font-weight="600" fill="#12263a">Tiered approval</text>
  </g>
  <!-- Row 2 -->
  <g>
    <rect x="60" y="466" width="352" height="104" rx="18" fill="#fdeec0"/>
    <text x="88" y="512" font-size="30" font-weight="700" fill="#12263a">5</text>
    <text x="128" y="514" font-size="25" font-weight="600" fill="#12263a">Create PO &amp; send</text>
    <rect x="436" y="466" width="352" height="104" rx="18" fill="#fde3c2"/>
    <text x="464" y="512" font-size="30" font-weight="700" fill="#12263a">6</text>
    <text x="504" y="514" font-size="25" font-weight="600" fill="#12263a">Receive &amp; inspect</text>
    <rect x="812" y="466" width="352" height="104" rx="18" fill="#fbd9d9"/>
    <text x="840" y="512" font-size="30" font-weight="700" fill="#12263a">7</text>
    <text x="880" y="514" font-size="25" font-weight="600" fill="#12263a">Capture invoice</text>
    <rect x="1188" y="466" width="352" height="104" rx="18" fill="#e4d9f7"/>
    <text x="1216" y="512" font-size="30" font-weight="700" fill="#12263a">8</text>
    <text x="1256" y="514" font-size="25" font-weight="600" fill="#12263a">Three-way match</text>
  </g>
  <!-- Row 3 -->
  <g>
    <rect x="248" y="602" width="352" height="104" rx="18" fill="#d5d9f8"/>
    <text x="276" y="648" font-size="30" font-weight="700" fill="#12263a">9</text>
    <text x="316" y="650" font-size="25" font-weight="600" fill="#12263a">Invoice approval</text>
    <rect x="624" y="602" width="352" height="104" rx="18" fill="#c9e4f6"/>
    <text x="652" y="648" font-size="30" font-weight="700" fill="#12263a">10</text>
    <text x="700" y="650" font-size="25" font-weight="600" fill="#12263a">Payment approval</text>
    <rect x="1000" y="602" width="352" height="104" rx="18" fill="#bcd7f5"/>
    <text x="1028" y="648" font-size="30" font-weight="700" fill="#12263a">11</text>
    <text x="1076" y="650" font-size="25" font-weight="600" fill="#12263a">Pay &amp; close PO</text>
  </g>

  <!-- Footer pills -->
  <g font-size="23" fill="#dbe7f3">
    <rect x="60" y="772" width="330" height="52" rx="26" fill="none" stroke="#33507a"/>
    <text x="225" y="806" text-anchor="middle">8 roles · JWT + RBAC</text>
    <rect x="414" y="772" width="360" height="52" rx="26" fill="none" stroke="#33507a"/>
    <text x="594" y="806" text-anchor="middle">Rules enforced server-side</text>
    <rect x="798" y="772" width="330" height="52" rx="26" fill="none" stroke="#33507a"/>
    <text x="963" y="806" text-anchor="middle">37/37 smoke tests pass</text>
    <rect x="1152" y="772" width="330" height="52" rx="26" fill="none" stroke="#33507a"/>
    <text x="1317" y="806" text-anchor="middle">Live on Render</text>
  </g>
  <rect x="60" y="872" width="1480" height="3" fill="url(#accent)" opacity="0.7"/>
</svg>
